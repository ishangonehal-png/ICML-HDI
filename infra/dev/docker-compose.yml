name: yc-aixbio-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: yc-aixbio-postgres
    restart: unless-stopped
    ports:
      - "${DEV_POSTGRES_PORT:-5432}:5432"
    environment:
      # Override these in your shell or .env file for local custom values.
      POSTGRES_USER: "${DEV_POSTGRES_USER:-yc_aixbio}"
      POSTGRES_PASSWORD: "${DEV_POSTGRES_PASSWORD:-change_me_local_only}"
      POSTGRES_DB: "${DEV_POSTGRES_DB:-yc_aixbio}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_POSTGRES_USER:-yc_aixbio} -d ${DEV_POSTGRES_DB:-yc_aixbio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yc-aixbio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
